<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <title>Despesas de Viagem - CSV</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Estilo personalizado */
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center my-4">Despesas de Viagem - CSV</h1>
    <div>
      <h3>Entrada de Despesas</h3>
      <div>
        <strong>Formato:</strong> Nome da Despesa, Quem Pagou, Valor, Participantes (separados por ;)<br>
        <em>Exemplo:</em><br>
        Almoço, João, 150.00, João;Maria;Pedro<br>
        Uber, Maria, 50.00, João;Maria
      </div>
      <textarea id="csvInput" rows="10" style="width: 100%; margin-top: 10px;">
Almoço no Shopping, João, 180.00, João;Maria;Pedro
Uber para o Hotel, Maria, 75.50, João;Maria;Pedro
Ingresso Museu, Pedro, 120.00, João;Maria;Pedro
Café da Manhã, João, 89.90, João;Maria
      </textarea>
    </div>
    <div>
      <h3>Despesas Registradas</h3>
      <div id="expensesList"></div>
    </div>
    <div>
      <h3>Resumo de Pagamentos</h3>
      <div id="summary"></div>
    </div>
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;

      const installButton = document.createElement('button');
      installButton.textContent = 'Instalar App';
      installButton.style = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      `;
      document.body.appendChild(installButton);

      installButton.addEventListener('click', () => {
        installButton.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Usuário aceitou a instalação');
          } else {
            console.log('Usuário recusou a instalação');
          }
          deferredPrompt = null;
        });
      });
    });
  </script>
</body>
</html>
